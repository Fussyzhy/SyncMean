# 同声传意 · 「只部署镜像」的 compose（2 核 2G 服务器推荐用这个）
#
# 这个文件里**没有 build**：服务器只负责 pull + up，构建放到内存充裕的机器 / CI 上做。
# 这样 `docker compose up` 的内存开销只有几十 MB，2G 小机器不会再被构建顶穿。
#
# 前提：镜像已经推到某个 registry（或已 docker load 到本机）。生产流程见 README §8。
#
# 用法（在服务器项目根目录）：
#   .env 里加一行：SYNCMEAN_IMAGE=ghcr.io/fussyzhy/syncmean:latest
#   bash deploy/deploy-pull.sh        # = pull + up -d --remove-orphans + 清理旧镜像
#
# 注意：和 docker-compose.yml 是同一个项目（同目录同名 service），两者不要同时 up，
# 只会保留最后启动的那一个容器。

services:
  app:
    # 必填，不写会直接报错并提示。examples：
    #   ghcr.io/fussyzhy/syncmean:latest
    #   registry.cn-hangzhou.aliyuncs.com/你的命名空间/syncmean:latest
    #   syncmean:latest   （用 docker load 导入的本机镜像）
    image: "${SYNCMEAN_IMAGE:?请先在 .env 里设置 SYNCMEAN_IMAGE，例如 ghcr.io/fussyzhy/syncmean:latest}"
    container_name: syncmean
    restart: unless-stopped
    ports:
      # 默认对所有网卡开放；前面挂 Nginx/Caddy 时改成 SYNCMEAN_BIND=127.0.0.1
      - "${SYNCMEAN_BIND:-0.0.0.0}:3210:3210"
    environment:
      NODE_ENV: production
      PORT: "3210"
      ADMIN_KEY: ${ADMIN_KEY:-}
      STUN_URLS: ${STUN_URLS:-}
      TURN_URL: ${TURN_URL:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
      # 运行期堆上限，镜像里默认 384MB（够用）。要放宽就取消注释：
      # NODE_OPTIONS: "--max-old-space-size=768"
    # 单容器内存硬上限 + 日志轮转：2G 小机器上防止一个容器把整机吃光、日志写满磁盘。
    mem_limit: ${APP_MEM_LIMIT:-512m}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3210)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

# 房间数据在内存里，只能 1 个副本；container_name 固定，不要 up --scale。
