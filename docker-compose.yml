services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 国内构建慢可改成 https://registry.npmmirror.com
        YARN_REGISTRY: https://registry.npmjs.org
    image: syncmean:latest
    container_name: syncmean
    restart: unless-stopped
    ports:
      # 只给反代/本机访问时改成 "127.0.0.1:3210:3210"
      - "3210:3210"
    environment:
      NODE_ENV: production
      PORT: "3210"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3210)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
# 注意：房间数据全部在内存里，只能跑 1 个实例。
# container_name 固定成单容器，请**不要**去掉它去 up --scale（会让同一房间的两人落到不同进程）。
